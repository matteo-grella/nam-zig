name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Unit tests
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
      - name: Load the vendored fixtures
        run: |
          ./zig-out/bin/nam-zig inspect src/testdata/wavenet.nam
          ./zig-out/bin/nam-zig inspect src/testdata/lstm.nam
      - name: No-BLAS build
        run: zig build -Dblas=none
