name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Unit tests
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseFast
      - name: Load the vendored fixtures
        shell: bash
        run: |
          ./zig-out/bin/nam-zig inspect src/testdata/wavenet.nam
          ./zig-out/bin/nam-zig inspect src/testdata/lstm.nam
      - name: Home folder and doctor (headless)
        shell: bash
        env:
          NAM_ZIG_HOME: ${{ runner.temp }}/nam-zig-home
        run: |
          ./zig-out/bin/nam-zig doctor --no-tone
          cp src/testdata/wavenet.nam "$NAM_ZIG_HOME/profiles/"
          ./zig-out/bin/nam-zig list
      - name: App bundle
        if: runner.os == 'macOS'
        run: zig build app -Doptimize=ReleaseFast
      - name: No-BLAS build
        if: runner.os != 'Windows'
        run: zig build -Dblas=none
