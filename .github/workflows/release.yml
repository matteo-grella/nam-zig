name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
            target: aarch64-macos
            cpu: apple_m1
            sysroot: "--sysroot $(xcrun --show-sdk-path)"
          - os: macos-15
            name: macos-x86_64
            target: x86_64-macos
            cpu: x86_64_v3
            sysroot: "--sysroot $(xcrun --show-sdk-path)"
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-linux-gnu
            cpu: x86_64_v3
          - os: ubuntu-latest
            name: linux-aarch64
            target: aarch64-linux-gnu
            cpu: baseline
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-windows-gnu
            cpu: x86_64_v3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        shell: bash
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }} ${{ matrix.sysroot }}
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          zig build app -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }} ${{ matrix.sysroot }}
          mkdir -p dist
          cp README.md LICENSE THIRD-PARTY-NOTICES.md zig-out/
          (cd zig-out && zip -qry "../dist/nam-zig-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" nam-zig.app bin/nam-zig README.md LICENSE THIRD-PARTY-NOTICES.md)
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist stage/nam-zig
          cp zig-out/bin/nam-zig README.md LICENSE THIRD-PARTY-NOTICES.md stage/nam-zig/
          tar -C stage -czf "dist/nam-zig-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" nam-zig
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist stage/nam-zig
          cp zig-out/bin/nam-zig.exe README.md LICENSE THIRD-PARTY-NOTICES.md stage/nam-zig/
          (cd stage && 7z a -tzip "../dist/nam-zig-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" nam-zig > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "nam-zig $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Downloads: pick your platform below and unzip.

          - macOS: open `nam-zig.app` (the first time, macOS may say the app is from an unidentified developer: open System Settings, Privacy & Security, and choose Open Anyway; the command-line binary is in `bin/`).
          - Linux: run `nam-zig/nam-zig`; the window needs GTK 3 and WebKitGTK, otherwise the page opens in your browser.
          - Windows: run `nam-zig\nam-zig.exe`; the page opens in your browser.

          First run: the app creates a `Music/nam-zig` folder with a `profiles` subfolder; drop `.nam` files there (thousands are free at tone3000.com) and press Rescan.
          NOTES
